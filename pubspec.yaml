name: quiz_app
description: "A secure quiz application for students, teachers, and administrators."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State & routing
  flutter_riverpod: ^3.4.3
  go_router: ^14.8.1

  # Backend
  supabase_flutter: ^2.7.0

  # Security
  flutter_screenguard: ^2.0.0
  ss_preventer: ^0.1.2
  flutter_fgbg: ^0.1.0

  # Utility
  excel: ^4.0.6
  crypto: ^3.0.6
  share_plus: ^12.0.1
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true